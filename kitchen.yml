---
driver:
  name: vagrant
  customize:
    memory: 1024

transport:
  max_wait_until_ready: 600
  connection_retries: 10
  connection_retry_sleep: 10

provisioner:
  name: chef_infra
  product_name: chef
  product_version: latest
  channel: stable
  chef_license: accept
  deprecations_as_errors: true

verifier:
  name: inspec
  sudo: true

platforms:
  - name: almalinux-8
  - name: debian-12
  - name: opensuse-leap-15
  - name: oraclelinux-8
  - name: rockylinux-8
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-run_lists:
  default: &default_run_list
    - recipe[test::default]
  builtin_services: &builtin_services_run_list
    - recipe[test::builtin_services]

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default
  builtin_services: &builtin_services_verifier
    inspec_tests:
      - path: test/integration/builtin_services

suites:
  - name: default
    run_list: *default_run_list
    verifier: *default_verifier

  - name: builtin-services
    run_list: *builtin_services_run_list
    verifier: *builtin_services_verifier
